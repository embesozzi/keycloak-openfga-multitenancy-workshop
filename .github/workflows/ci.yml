name: CI

# Starts the whole workshop and runs the end-to-end tests (make test)
# Skipped when only docs change (README, BACKLOG, images)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'doc/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # The PayPlus app image is arm64 only: emulate it on the amd64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Validate the compose file
        run: docker compose config --quiet

      - name: Start the workshop
        run: make up

      - name: Smoke test
        run: make test

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the workshop
        if: always()
        run: docker compose down -v
